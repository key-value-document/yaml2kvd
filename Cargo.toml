[package]
name = "yaml2kvd"
description = "Convert YAML documents to KVD — and KVD to YAML with --reverse"
version = "1.0.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
repository = "https://github.com/key-value-document/yaml2kvd"
keywords = ["kvd", "yaml", "config", "conversion", "cli"]
categories = ["command-line-utilities", "config", "encoding"]
exclude = [".github/**", ".gitignore"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
kvd-rs = "1.0.0"
serde_yaml_ng = "0.10.0"

[patch.crates-io]
kvd-rs = { path = "../kvd-rs" }
